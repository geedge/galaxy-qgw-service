nacos:
  config:
    type: yaml #配置集的配置格式
    server-addr: 192.168.44.12:8848 #配置中心地址
    namespace: nacos-namespace-galaxy #命名空间
    data-id: galaxy-qgw-service # 数据集ID
    auto-refresh: true #开启自动刷新
    group: DEFAULT_GROUP  #配置对应的分组
    username: galaxy #Nacos认证用户
    pin: galaxy #Nacos认证密码
    bootstrap:
      enable: true #开启配置预加载功能
      log:
        enable: true #开启Nacos支持日志级别的加载时机
spring:
  profiles:
    active: dev
logging:
  config: ./config/log4j2.xml



