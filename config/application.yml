nacos:
  config:
    type: yaml #配置集的配置格式
    server-addr: 127.0.0.1:8848 #配置中心地址(1.本地配置模式: server-addr指定为127.0.0.1:8848 2.IDE配置VM启动参数：-DJM.SNAPSHOT.PATH=config)
    namespace: tsg #命名空间
    data-id: galaxy-qgw-service.yml # 数据集ID
    auto-refresh: true #开启自动刷新
    group: Galaxy  #配置对应的分组
    username: nacos #Nacos认证用户
    password: nacos #Nacos认证密码
    bootstrap:
      enable: true #开启配置预加载功能
      log:
        enable: true #开启Nacos支持日志级别的加载时机
logging:
  config: ./config/log4j2.xml

#配置文件传输大小(上传文件大小:目前1个G)
spring:
  servlet:
    multipart:
      max-file-size: 1073741824
      max-request-size: 1073741824
