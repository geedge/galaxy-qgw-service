##############静态参数配置(修改后需要重启项目)##############
## 服务配置
server:
  port: 9999
## 监控参数
management:
  metrics:
    tags:
      application: ${project.name}
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true
  health:
    redis:
      enabled: false
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: '*'
        exclude: env,auditevents,beans,conditions,info
      base-path: /v1/monitor
      path-mapping:
        health: /component_status
#MySql configuration
spring:
  sleuth:
    enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.44.12:3306/tsg_olap?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=UTC&failOverReadOnly=false&connectTimeout=10000&socketTimeout=30000
    username: ENC(63aTpwv2vH0vPikW+3Jjig==)
    password: ENC(LDEb2OekU7iZWiFw6pUYBSozVKP27r1y)
  flyway:
    enabled: true              # 是否开启
    encoding: UTF-8            # 编码
    sql-migration-prefix: V    # 脚本文件的前缀，默认为V
    sql-migration-separator: __ #  双下划线
    baseline-on-migrate: true  # 连接数据库中存在表时设置为true
    check-location: false
    locations: filesystem:./config/flyway/tsg   # 脚本路径
    clean-disabled: true      # flyway 的 clean 命令会删除指定 schema 下的所有 table, 生产务必禁掉。这个默认值是 false 理论上作为默认配置是不科学的
    validate-on-migrate: true # 执行迁移时是否自动调用验证   当你的 版本不符合逻辑 比如 你先执行了 DML 而没有 对应的DDL 会抛出异常
    placeholder-replacement: false  # 不做取值替换 默认替换为 ${} ，初始化sql中有sql语句存在freemarker替换，所以禁用此项
## Hbase configuration
hbase:
