## 服务配置
server:
  port: 9999
## 监控参数
management:
  metrics:
    tags:
      application: ${project.name}
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true
  health:
    redis:
      enabled: false
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: '*'
        exclude: env,auditevents,beans,conditions,info
      base-path: /monitor
