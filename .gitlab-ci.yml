
stages:
  - install
  - install_clean
  - build
  - clean
  - deploy
install:
  #上面定义的stages
  stage: install
  #执行的脚本内容
  script:
    - echo 'exec mvn clean install'
    - mvn clean install -Dmaven.test.skip=true
  only:
    - tags
  tags:
    - galaxy

build:
  stage: build
  script:
    - echo 'exec mvn clean package'
    - echo 'tag:' $CI_COMMIT_TAG
    - cd service
    - mvn package -Dmaven.test.skip=true
  only:
    - tags
  tags:
    - galaxy

clean:
  stage: clean
  script:
    - echo 'build job fail, exec mvn clean'
    - echo  'tag:' $CI_COMMIT_TAG
    - mvn clean
  when: on_failure
  only:
    - tags
  tags:
    - galaxy
deploy:
  stage: deploy
  script:
    - echo 'exec mvn package & docker build'
    - echo  'tag:' $CI_COMMIT_TAG
    - cd service
    - mvn package -Dmaven.test.skip=true docker:build -DdockerImageTags=$CI_COMMIT_TAG
  when: on_success
  only:
    - tags
  tags:
    - galaxy