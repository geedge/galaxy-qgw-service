stages:
  - build
  - clean
  - deploy

build:
  stage: build
  script:
    - echo 'exec mvn clean install'
    - echo 'tag:' $CI_COMMIT_TAG
    - mvn clean install -Dmaven.test.skip=true -Dxjar.password=ceiec
  only:
    - tags
  tags:
    - share

clean:
  stage: clean
  script:
    - echo 'build job fail, exec mvn clean'
    - echo  'tag:' $CI_COMMIT_TAG
    - mvn clean
  when: on_failure
  only:
    - tags
  tags:
    - GN-XXG-Server
deploy:
  stage: deploy
  script:
    - echo 'exec mvn install & docker build'
    - echo  'tag:' $CI_COMMIT_TAG
    - mvn clean install -Dmaven.test.skip=true -Dxjar.password=ceiec docker:build -DdockerImageTags=$CI_COMMIT_TAG
  when: on_success
  only:
    - tags
  tags:
    - GN-XXG-Server
